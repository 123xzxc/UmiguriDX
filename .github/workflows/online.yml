name: online

# 联机版构建。与 release.yml 分开: 那个只出客户端, 这个是「客户端 + 服务端」。
#
# 触发: 手动(Actions → online → Run workflow)或推 v* 标签。
#
# 为什么单独一套:
#   - 联机版客户端需要验证联机链路(卡号登录/TOTP/房间), release.yml 不跑这些;
#   - 服务端此前完全没进 CI, 既没测过也没出过可部署产物;
#   - 客户端产物不预置服务端地址(用户首次启动填), 所以一份包能连任意服务器。
#
# 产物:
#   UMIGURI-online-<平台>      联机版客户端(与普通版同一套代码, 便于区分命名)
#   umiguri-server-<版本>      服务端部署包(tar.gz, 零依赖)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------- 服务端: 语法 + 全链路测试 ----------------
  # 卡号登录、TOTP 面板、发卡/吊销、房间与实时对手分数都靠这一关守住。
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 必须 >= 22.5: 服务端用 node:sqlite, 低版本直接起不来
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # find 用 -print0 + read -d '': 路径带空格时不会被拆成两个文件。
      # (仓库里目前没这种路径, 但服务端将来加测试文件很容易踩到。)
      - name: 语法检查
        working-directory: umiguri-server
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            node --check "$f" || fail=1
          done < <(find src test tools -type f \( -name "*.js" -o -name "*.mjs" \) -print0)
          exit $fail
      - name: 冒烟测试(卡号 / TOTP / 面板 / 房间)
        working-directory: umiguri-server
        env:
          UMIGURI_JWT_SECRET: ci-test-secret
          UMIGURI_ADMIN_TOKEN: ci-admin-token
        run: node test/smoke.mjs

  # ---------------- 服务端: 打包可部署产物 ----------------
  server-pack:
    runs-on: ubuntu-latest
    needs: server-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 打包
        working-directory: umiguri-server
        run: node tools/pack.mjs
      # 产物自带 DEPLOY.md, 解包即可跑, 无需 npm install
      - uses: actions/upload-artifact@v5
        with:
          name: umiguri-server
          path: umiguri-server/dist/*.tar.gz
          if-no-files-found: error
  # ---------------- 客户端构建自检 ----------------
  # 联机版客户端里新增了 account 模块与启动器。游戏前端是混淆打包的,
  # 形参与局部量同名会被合并成同一绑定 —— 之前 macOS 界面无文字就是这么来的
  # (见 open-umiguri/REGRESSION.md)。所以这里跑一遍混淆构建 + 三项检查,
  # 让这类问题在 CI 就暴露, 而不是等出包后靠人肉眼发现。
  client-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-umiguri/package-lock.json
      - name: 安装前端依赖
        working-directory: open-umiguri
        run: npm ci
      # 资源包 + 混淆构建宿主与游戏前端
      - name: 构建资源与前端包(混淆)
        working-directory: open-umiguri
        run: npm run build:esm
      - name: 契约与自由变量检查
        working-directory: open-umiguri
        run: npm run check
      # 反解 main.js.enc, 确认联机链路真的进了产物(而不是被 tree-shake 掉)
      - name: 校验混淆产物含联机链路
        working-directory: open-umiguri
        run: node tools/verify-online-bundle.mjs

  # ---------------- 联机版客户端: 桌面三平台 ----------------
  # 复用 release.yml 的 tauri 流程, 只改产物命名, 避免两套构建脚本漂移。
  desktop:
    needs: server-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            rustTarget: ""
            bundleDir: release
            bundle: |
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/nsis/*
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/msi/*
          - runner: macos-latest
            os: macos-x86_64
            rustTarget: x86_64-apple-darwin
            bundleDir: x86_64-apple-darwin/release
            bundle: |
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/dmg/*
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/macos/*
          - runner: macos-latest
            os: macos-aarch64
            rustTarget: aarch64-apple-darwin
            bundleDir: aarch64-apple-darwin/release
            bundle: |
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/dmg/*
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/macos/*
          - runner: ubuntu-22.04
            os: linux
            rustTarget: ""
            bundleDir: release
            bundle: |
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/deb/*
              open-umiguri/src-tauri/target/${{ matrix.bundleDir }}/bundle/appimage/*
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-umiguri/package-lock.json
      # 宿主架构不需要显式 targets; macos 两个架构都要交叉编译, 必须装对应工具链。
      # 拆成两步而不是给 targets 传空串: 后者在 rust-toolchain 里行为不确定。
      - if: matrix.rustTarget == ''
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.rustTarget != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: open-umiguri/src-tauri -> target
          key: online-${{ matrix.os }}
      - name: 系统依赖(WebKitGTK 等)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev patchelf libfuse2
      - name: 安装前端依赖
        working-directory: open-umiguri
        run: npm ci
      # beforeBuildCommand 会跑 npm run build:esm(打包 assets + 混淆构建宿主与游戏)
      - name: 构建联机版客户端
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: open-umiguri
          args: ${{ matrix.rustTarget != '' && format('--target {0}', matrix.rustTarget) || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('UMIGURI-online {0}', github.ref_name) || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v5
        with:
          name: UMIGURI-online-${{ matrix.os }}
          path: ${{ matrix.bundle }}
          if-no-files-found: warn
