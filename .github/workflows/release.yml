name: release

# 手动触发(Actions → release → Run workflow)或推 v* 标签。
# 桌面端(windows/macos/linux)用 tauri-action: 构建 + 上传产物, 推标签时自动建 Release。
# 移动端(ios/android)用 tauri CLI + upload-artifact 上传产物。
#
# 注意:
#   - 资源(open-umiguri/assets, 526 个文件)已入库, CI 能打包语言包/内置曲目;
#     但用户自建的曲库目录 assets/data/music/PING 被 gitignore, 不会出现在 CI 产物里。
#   - iOS 产物为未签名(需 Apple 证书/描述文件才能分发); 见 ios job 注释。
#   - Android CI 会生成一次性签名密钥; 要长期分发请改用固定密钥(见 android job 注释)。
# 建 Release 需要写权限(默认 GITHUB_TOKEN 只读, 会出现
# "Resource not accessible by integration")
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------- 服务端: 语法 + 全链路测试 ----------------
  # 卡号登录、TOTP 面板、发卡/吊销、房间与实时对手分数都靠这一关守住。
  # 服务端零第三方依赖, 跑起来只要几十秒, 不需要 npm install。
  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 必须 >= 22.5: 服务端用 node:sqlite, 低版本直接起不来
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # -print0 + read -d "" 逐条读: 路径带空格时不会被拆成两个词。
      # 服务端现在没有这种路径, 但加测试文件很容易踩到, 提前堵住。
      - name: 语法检查
        working-directory: umiguri-server
        run: |
          fail=0
          while IFS= read -r -d "" f; do
            node --check "$f" || fail=1
          done < <(find src test tools -type f \( -name "*.js" -o -name "*.mjs" \) -print0)
          exit $fail
      - name: 冒烟测试(卡号 / TOTP / 面板 / 房间 / 实时分数)
        working-directory: umiguri-server
        env:
          UMIGURI_JWT_SECRET: ci-test-secret
          UMIGURI_ADMIN_TOKEN: ci-admin-token
        run: node test/smoke.mjs

  # ---------------- 服务端: 打包可部署产物 ----------------
  server-pack:
    runs-on: ubuntu-latest
    needs: server-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 打包
        working-directory: umiguri-server
        run: node tools/pack.mjs
      # 产物自带 DEPLOY.md, 解包即可跑, 无需 npm install
      - uses: actions/upload-artifact@v5
        with:
          name: umiguri-server
          path: umiguri-server/dist/*.tar.gz
          if-no-files-found: error

  # ---------------- 桌面: Windows ----------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-umiguri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: open-umiguri/src-tauri -> target
      - name: 安装前端依赖
        working-directory: open-umiguri
        run: npm ci
      # beforeBuildCommand 会自动执行 npm run build:esm(打包 assets + 构建宿主与游戏 ESM)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: open-umiguri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('UMIGURI {0}', github.ref_name) || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v5
        with:
          name: UMIGURI-windows
          path: |
            open-umiguri/src-tauri/target/release/bundle/nsis/*
            open-umiguri/src-tauri/target/release/bundle/msi/*
          if-no-files-found: warn

  # ---------------- 桌面: macOS(按架构分开, 避免 lipo 合并失败) ----------------
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个架构都在 macos-latest 上构建(macos-13 正在被淘汰, 排队极慢);
          # 不做 lipo 合并, 因此跨架构编译没问题。
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64
          - runner: macos-latest
            target: x86_64-apple-darwin
            suffix: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-umiguri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: open-umiguri/src-tauri -> target
          key: ${{ matrix.target }}
      - name: 安装前端依赖
        working-directory: open-umiguri
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: open-umiguri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('UMIGURI {0}', github.ref_name) || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v5
        with:
          name: UMIGURI-macos-${{ matrix.suffix }}
          path: |
            open-umiguri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*
            open-umiguri/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*
          if-no-files-found: warn

  # ---------------- 桌面: Linux ----------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-umiguri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: open-umiguri/src-tauri -> target
      - name: 系统依赖(WebKitGTK 等)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file pkg-config \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev patchelf libfuse2
      - name: 安装前端依赖
        working-directory: open-umiguri
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: open-umiguri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('UMIGURI {0}', github.ref_name) || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v5
        with:
          name: UMIGURI-linux
          path: |
            open-umiguri/src-tauri/target/release/bundle/deb/*
            open-umiguri/src-tauri/target/release/bundle/appimage/*
            open-umiguri/src-tauri/target/release/bundle/rpm/*
          if-no-files-found: warn

  # ---------------- iOS(未签名) ----------------
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-umiguri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: open-umiguri/src-tauri -> target
      - name: 安装前端依赖
        working-directory: open-umiguri
        run: npm ci
      # ios init 会校验 tauri.conf.json 的 bundle.resources(../dist/game_data),
      # 因此必须先生成资源; beforeBuildCommand 也会跑一次(幂等)。
      - name: 构建资源与前端包
        working-directory: open-umiguri
        run: npm run build:esm
      - name: 生成 Xcode 工程(gen/apple)
        working-directory: open-umiguri/src-tauri
        run: npx tauri ios init --ci
      # 生成应用图标(app-icon.json): 同时刷新 iOS AppIcon 与桌面图标
      - name: 生成应用图标
        working-directory: open-umiguri/src-tauri
        run: npx tauri icon app-icon.json
      # 未签名: 需要分发(.ipa)时在仓库 secrets 配置 Apple 证书/描述文件, 并去掉 --no-sign。
      # tools/patch-ios.mjs(全屏/安全区原生补丁)由 beforeBuildCommand 自动应用。
      - name: 构建 iOS(未签名)
        working-directory: open-umiguri/src-tauri
        run: npx tauri ios build --no-sign
      - uses: actions/upload-artifact@v5
        with:
          name: UMIGURI-ios-unsigned
          path: |
            open-umiguri/src-tauri/gen/apple/build/**
            open-umiguri/src-tauri/target/**/*.ipa
            open-umiguri/src-tauri/target/**/*.app
          if-no-files-found: warn

  # ---------------- Android ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: open-umiguri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: open-umiguri/src-tauri -> target
      - name: 配置 Android SDK / NDK
        run: |
          # runner 自带 Android SDK, 不需要 setup-android(其 sdkmanager tools 已失效)
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "ndk;26.1.10909125"
          echo "NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: 安装前端依赖
        working-directory: open-umiguri
        run: npm ci
      - name: 初始化 Android 工程
        working-directory: open-umiguri/src-tauri
        run: npx tauri android init
      # 生成应用图标: app-icon.json 指定 Android 自适应前景(android-fg.png, 已留安全边距),
      # 避免前景铺满整个画布导致启动器图标显得过大/被裁切。
      - name: 生成应用图标
        working-directory: open-umiguri/src-tauri
        run: npx tauri icon app-icon.json
      # 一次性密钥: 长期分发请改为固定密钥(把 jks 存为 secret, 这里 base64 解码到
      # src-tauri/gen/android/umiguri-release.jks 并写 keystore.properties)。
      - name: 接入 release 签名
        working-directory: open-umiguri
        env:
          UMG_KEYSTORE_PASS: ${{ secrets.UMG_KEYSTORE_PASS || 'umiguri-release' }}
        run: npm run android:sign
      - name: 构建 APK + AAB
        working-directory: open-umiguri/src-tauri
        env:
          UMG_DROP_PING: '1' # 安卓不打包用户曲库(data/music/PING)
        run: npx tauri android build --apk --aab --split-per-abi -t aarch64 armv7
      - uses: actions/upload-artifact@v5
        with:
          name: UMIGURI-android
          path: |
            open-umiguri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            open-umiguri/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
